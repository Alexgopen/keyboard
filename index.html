<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rainbow Piano</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #151515;
      overflow: hidden;
      user-select: none;
    }

    button, select { font: inherit; }

    #light-wrap {
      position: relative;
      height: 42vh;
    }

    #light {
      width: 100%;
      height: 100%;
      background: #222;
      transition: background-color 80ms ease, box-shadow 80ms ease;
    }

    #sound-select-wrap {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(6px);
    }

    #sound-select-wrap label {
      color: white;
      font-size: 14px;
      font-weight: 700;
    }

    #sound-select {
      font-size: 14px;
      padding: 6px 8px;
      border: 0;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.94);
      color: #111;
      cursor: pointer;
    }

    #transport {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.46);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(6px);
      transition: transform 80ms ease, background 100ms ease;
    }

    .icon-button:hover { background: rgba(0, 0, 0, 0.62); }
    .icon-button:active { transform: translateY(2px); }
    .icon-button.active { background: rgba(255, 255, 255, 0.28); }

    .icon-button svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
      stroke: currentColor;
    }

    #piano {
      height: 58vh;
      display: flex;
      gap: 5px;
      padding: 12px;
    }

    .key {
      flex: 1;
      border: none;
      border-radius: 0 0 18px 18px;
      cursor: pointer;
      box-shadow:
        inset 0 -12px 0 rgba(0,0,0,0.18),
        0 6px 14px rgba(0,0,0,0.35);
      transition: transform 60ms ease, filter 60ms ease;
    }

    .key:hover { filter: brightness(1.08); }

    .key:active,
    .key.active {
      transform: translateY(8px);
      filter: brightness(1.2);
      box-shadow:
        inset 0 -4px 0 rgba(0,0,0,0.18),
        0 2px 5px rgba(0,0,0,0.35);
    }

    .red        { background: #ff3b30; }
    .redorange  { background: #ff5e2b; }
    .orange     { background: #ff8c1a; }
    .amber      { background: #ffb000; }
    .yellow     { background: #ffd60a; }
    .lime       { background: #9bdc28; }
    .green      { background: #34c759; }
    .turquoise  { background: #20c9b0; }
    .blue       { background: #2f80ed; }
    .indigo     { background: #5856d6; }
    .violet     { background: #af52de; }

    dialog {
      width: min(960px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      border: 0;
      border-radius: 16px;
      padding: 0;
      background: #202020;
      color: white;
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    }

    dialog::backdrop {
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(3px);
    }

    .dialog-header {
      padding: 14px 16px;
      border-bottom: 1px solid #3a3a3a;
    }

    .dialog-header h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
    }

    .dialog-actions {
      display: grid;
      gap: 8px;
    }

    .dialog-action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .dialog-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .dialog-group + .dialog-group {
      padding-left: 10px;
      border-left: 1px solid #444;
    }

    .small-button {
      border: 0;
      border-radius: 8px;
      padding: 8px 11px;
      background: #3a3a3a;
      color: white;
      cursor: pointer;
    }

    .small-button:hover { background: #4a4a4a; }

    #tempo,
    #sequence-select,
    #sequence-name {
      border: 0;
      border-radius: 7px;
      padding: 7px 8px;
      background: #f5f5f5;
      color: #111;
    }

    #tempo { width: 78px; }
    #sequence-select { min-width: 150px; }
    #sequence-name { width: 150px; }

    .tempo-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #ddd;
    }

    #roll-wrap {
      overflow: auto;
      padding: 14px;
    }

    #piano-roll {
      display: grid;
      grid-template-columns: 58px repeat(16, minmax(32px, 1fr));
      gap: 3px;
      min-width: 720px;
      touch-action: none;
    }

    .roll-label {
      height: 30px;
      border-radius: 6px 0 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111;
      font-size: 12px;
      font-weight: 700;
    }

    .roll-cell {
      position: relative;
      height: 30px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2b2b2b;
      cursor: crosshair;
    }

    .roll-cell.on.join-left::before {
      content: "";
      position: absolute;
      left: -4px;
      top: -1px;
      bottom: -1px;
      width: 5px;
      background: var(--note-color);
      pointer-events: none;
    }

    .roll-cell.on.join-left {
      border-left-color: transparent;
      border-radius: 0 4px 4px 0;
    }

    .roll-cell.on.join-right {
      border-right-color: transparent;
      border-radius: 4px 0 0 4px;
    }

    .roll-cell.on.join-left.join-right {
      border-radius: 0;
    }

    .roll-cell.beat {
      border-left-color: #727272;
    }

    .roll-cell.on {
      border-color: rgba(255,255,255,0.75);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
    }

    .roll-cell.playing {
      outline: 2px solid white;
      outline-offset: -2px;
    }

    #step-header {
      display: contents;
    }

    .step-number {
      height: 24px;
      display: grid;
      place-items: center;
      color: #aaa;
      font-size: 11px;
    }

    .roll-corner {
      height: 24px;
    }

    .dialog-help {
      padding: 0 16px 8px;
      margin: 0;
      color: #aaa;
      font-size: 12px;
    }

    #export-status {
      min-height: 18px;
      padding: 0 16px 15px;
      margin: 0;
      color: #ddd;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      #sound-select-wrap {
        top: 8px;
        left: 8px;
      }

      #transport {
        top: 8px;
        right: 8px;
      }

      .icon-button {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>
<body>
  <div id="light-wrap">
    <div id="light"></div>

    <div id="sound-select-wrap">
      <label for="sound-select">Sound</label>
      <select id="sound-select">
        <option value="electric">Electric Piano</option>
        <option value="pad">Warm Pad</option>
        <option value="bell">Bell</option>
        <option value="organ">Organ</option>
        <option value="pluck">Pluck</option>
        <option value="gbpulse">8-Bit Pulse</option>
        <option value="gbsquare">Game Boy Square</option>
        <option value="gbsoft">Pocket Lead</option>
        <option value="gbbass">8-Bit Bass</option>
        <option value="wiipluck">Console Pluck</option>
        <option value="wiibell">Menu Bell</option>
        <option value="wiimarimba">Soft Marimba</option>
        <option value="wiibubble">Bubble Synth</option>
        <option value="wiiair">Airy Keys</option>
        <option value="wiichime">Glass Chime</option>
        <option value="rsflute">Adventure Flute</option>
        <option value="rslute">Village Lute</option>
        <option value="rshorn">Quest Horn</option>
        <option value="rsharps">Castle Harp</option>
        <option value="rsmystic">Mystic Cave</option>
        <option value="rswood">Woodland Pipes</option>
        <option value="spookydrone">Crypt Drone</option>
        <option value="spookyorgan">Haunted Organ</option>
        <option value="spookybells">Graveyard Bells</option>
        <option value="spookylute">Cursed Lute</option>
        <option value="spookychoir">Monastery Choir</option>
        <option value="spookyhurdy">Hurdy-Gurdy</option>
        <option value="spookypipes">Witchwood Pipes</option>
        <option value="screamghost">Ghost Scream</option>
        <option value="screamdemon">Demon Shriek</option>
        <option value="screamchoir">Wailing Choir</option>
        <option value="screambanshee">Banshee</option>
        <option value="screammonster" selected>Monster Roar</option>
        <option value="musicbox">Clockwork Music Box</option>
        <option value="dulcimer">Hammered Dulcimer</option>
        <option value="celesta">Moonlit Celesta</option>
        <option value="ocarina">Clay Ocarina</option>
        <option value="reed">Old Reed Organ</option>
        <option value="crystal">Crystal Resonator</option>
        <option value="copper">Copper Strings</option>
        <option value="deepbell">Deep Temple Bell</option>
        <option value="frost">Frost Pad</option>
        <option value="arcade">Arcade Lead</option>
        <option value="machine">Machine Voice</option>
        <option value="goblin">Goblin Pipe</option>
      </select>
    </div>

    <div id="transport">
      <button id="edit-button" class="icon-button" title="Draw sequence" aria-label="Draw sequence">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 17.25V21h3.75L17.8 9.95l-3.75-3.75L3 17.25zm2.92 2.25H4.5v-1.42l9.55-9.55 1.42 1.42-9.55 9.55zM20.71 7.04a1 1 0 0 0 0-1.42l-2.34-2.34a1 1 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/>
        </svg>
      </button>

      <button id="play-button" class="icon-button" title="Play sequence" aria-label="Play sequence">
        <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <button id="loop-button" class="icon-button" title="Loop sequence" aria-label="Loop sequence" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 1l4 4-4 4V6h-6a5 5 0 0 0-5 5H4a7 7 0 0 1 7-7h6V1zm3 12a7 7 0 0 1-7 7H7v3l-4-4 4-4v3h6a5 5 0 0 0 5-5h2z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="piano">
    <button class="key red"       data-note="196.00" data-name="G3" data-color="#ff3b30" aria-label="G3 red piano key"></button>
    <button class="key redorange" data-note="220.00" data-name="A3" data-color="#ff5e2b" aria-label="A3 red-orange piano key"></button>
    <button class="key orange"    data-note="246.94" data-name="B3" data-color="#ff8c1a" aria-label="B3 orange piano key"></button>
    <button class="key amber"     data-note="261.63" data-name="C4" data-color="#ffb000" aria-label="C4 amber piano key"></button>
    <button class="key yellow"    data-note="293.66" data-name="D4" data-color="#ffd60a" aria-label="D4 yellow piano key"></button>
    <button class="key lime"      data-note="329.63" data-name="E4" data-color="#9bdc28" aria-label="E4 lime piano key"></button>
    <button class="key green"     data-note="349.23" data-name="F4" data-color="#34c759" aria-label="F4 green piano key"></button>
    <button class="key turquoise" data-note="392.00" data-name="G4" data-color="#20c9b0" aria-label="G4 turquoise piano key"></button>
    <button class="key blue"      data-note="440.00" data-name="A4" data-color="#2f80ed" aria-label="A4 blue piano key"></button>
    <button class="key indigo"    data-note="493.88" data-name="B4" data-color="#5856d6" aria-label="B4 indigo piano key"></button>
    <button class="key violet"    data-note="523.25" data-name="C5" data-color="#af52de" aria-label="C5 violet piano key"></button>
  </div>

  <dialog id="sequencer-dialog">
    <div class="dialog-header">
      <h2>Draw a melody</h2>

      <div class="dialog-actions">
        <div class="dialog-action-row">
          <div class="dialog-group">
            <select id="sequence-select" aria-label="Saved melody"></select>
            <input id="sequence-name" type="text" maxlength="40" value="Untitled" aria-label="Melody name">
            <button id="save-button" class="small-button" type="button">Save</button>
            <button id="delete-saved-button" class="small-button" type="button">Delete Saved</button>
          </div>

          <div class="dialog-group">
            <button id="clear-button" class="small-button" type="button">Clear Notes</button>
          </div>
        </div>

        <div class="dialog-action-row">
          <div class="dialog-group">
            <button id="dialog-play-button" class="small-button" type="button">Play</button>
            <button id="dialog-loop-button" class="small-button" type="button" aria-pressed="false">Loop</button>
            <label class="tempo-label">BPM
              <input id="tempo" type="number" min="40" max="240" value="110">
            </label>
          </div>

          <div class="dialog-group">
            <button id="export-button" class="small-button" type="button">Export MP3</button>
            <button id="close-button" class="small-button" type="button">Done</button>
          </div>
        </div>
      </div>
    </div>
    <div id="roll-wrap">
      <div id="piano-roll"></div>
    </div>
    <p class="dialog-help">Click once for a single-step note. Press and drag horizontally before releasing to stretch that one note into a sustain. Adjacent separately-clicked notes stay separate. Click an existing note block to delete it. Stack notes vertically for chords.</p>
    <p id="export-status" aria-live="polite"></p>
  </dialog>

  <script>
    const light = document.getElementById("light");
    const keys = [...document.querySelectorAll(".key")];
    const soundSelect = document.getElementById("sound-select");
    const editButton = document.getElementById("edit-button");
    const playButton = document.getElementById("play-button");
    const loopButton = document.getElementById("loop-button");
    const sequencerDialog = document.getElementById("sequencer-dialog");
    const pianoRoll = document.getElementById("piano-roll");
    const closeButton = document.getElementById("close-button");
    const clearButton = document.getElementById("clear-button");
    const tempoInput = document.getElementById("tempo");
    const sequenceSelect = document.getElementById("sequence-select");
    const sequenceName = document.getElementById("sequence-name");
    const saveButton = document.getElementById("save-button");
    const exportButton = document.getElementById("export-button");
    const exportStatus = document.getElementById("export-status");
    const deleteSavedButton = document.getElementById("delete-saved-button");
    const dialogPlayButton = document.getElementById("dialog-play-button");
    const dialogLoopButton = document.getElementById("dialog-loop-button");

    let audioContext;
    let dragging = false;
    let activeKey = null;
    let activeVoice = null;

    let rollDragging = false;
    let rollDragKeyIndex = null;
    let rollDragStartStep = null;
    let rollDragCurrentStep = null;
    let rollDragPointerId = null;

    let sequencePlaying = false;
    let loopEnabled = false;
    let playTimer = null;
    let currentStep = 0;
    let sequenceVoices = [];

    const STEPS = 16;
    const STORAGE_KEY = "rainbowPianoSequencesV1";
    // Each row stores note duration at the note's START step.
    // 0 = no note starts here; 1 = single step; 4 = four-step sustained note, etc.
    const pattern = Array.from({ length: keys.length }, () => Array(STEPS).fill(0));

    // A compact built-in pop-rock beat sketch, saved under the requested title.
    // It is intentionally a simple playable preset rather than a note-for-note transcription.
    const defaultSequences = {};

    let savedSequences = {};

    function clonePattern(source) {
      return source.map(row => row.slice());
    }

    function readSavedSequences() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        savedSequences = raw ? JSON.parse(raw) : {};
      } catch {
        savedSequences = {};
      }
    }

    function writeSavedSequences() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedSequences));
      } catch {}
    }

    function loadSequenceData(data) {
      if (!data || !Array.isArray(data.pattern)) return;

      for (let r = 0; r < keys.length; r++) {
        pattern[r].fill(0);

        for (let s = 0; s < STEPS; s++) {
          const value = data.pattern[r]?.[s];

          // Backward compatibility with older boolean saves.
          if (value === true) {
            pattern[r][s] = 1;
          } else if (Number.isFinite(Number(value)) && Number(value) > 0) {
            pattern[r][s] = Math.min(STEPS - s, Math.max(1, Math.floor(Number(value))));
          }
        }
      }

      tempoInput.value = Math.min(240, Math.max(40, Number(data.bpm) || 110));
      renderRoll();
    }

    function refreshSequenceSelect(selectedName) {
      const names = [
        ...Object.keys(defaultSequences),
        ...Object.keys(savedSequences).filter(name => !defaultSequences[name])
      ];

      sequenceSelect.innerHTML = "";

      if (names.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No saved tracks";
        sequenceSelect.appendChild(option);
        sequenceSelect.disabled = true;
      } else {
        sequenceSelect.disabled = false;
        names.forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = `${name} • saved`;
          sequenceSelect.appendChild(option);
        });

        if (selectedName && names.includes(selectedName)) {
          sequenceSelect.value = selectedName;
        }
      }
    }

    function loadSequenceByName(name) {
      const data = savedSequences[name] || defaultSequences[name];
      if (!data) return;
      sequenceName.value = name;
      loadSequenceData(data);
    }

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    function buildVoice(frequency, sound = soundSelect.value, swell = true) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const master = ctx.createGain();
      const oscillators = [];

      master.gain.setValueAtTime(0.0001, now);
      master.connect(ctx.destination);

      function addOsc(type, freq, detune, volume, destination = master) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        osc.detune.setValueAtTime(detune, now);
        gain.gain.setValueAtTime(volume, now);

        osc.connect(gain);
        gain.connect(destination);
        osc.start(now);
        oscillators.push(osc);
      }

      if (sound === "pad") {
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(3600, now);
        filter.Q.setValueAtTime(0.6, now);
        filter.connect(master);

        [-18, -9, 0, 9, 18].forEach((detune, i) => {
          addOsc(i % 2 === 0 ? "sine" : "triangle", frequency, detune, i === 2 ? 0.24 : 0.14, filter);
        });

        master.gain.exponentialRampToValueAtTime(0.32, now + 0.12);
        if (swell) {
          master.gain.exponentialRampToValueAtTime(0.58, now + 1.2);
          master.gain.exponentialRampToValueAtTime(0.82, now + 3.5);
        } else {
          master.gain.exponentialRampToValueAtTime(0.48, now + 0.35);
        }

      } else if (sound === "electric") {
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(5000, now);
        filter.Q.setValueAtTime(0.8, now);
        filter.connect(master);

        addOsc("triangle", frequency, -7, 0.30, filter);
        addOsc("triangle", frequency, 7, 0.30, filter);
        addOsc("sine", frequency * 2, -3, 0.14, filter);
        addOsc("sine", frequency * 2.01, 3, 0.11, filter);
        addOsc("sine", frequency * 3, 0, 0.06, filter);

        master.gain.exponentialRampToValueAtTime(0.60, now + 0.03);
        master.gain.exponentialRampToValueAtTime(0.72, now + 1.8);

      } else if (sound === "bell") {
        [[1.00, 0.48], [2.01, 0.22], [3.90, 0.14], [5.40, 0.08]].forEach(([ratio, volume]) => {
          addOsc("sine", frequency * ratio, 0, volume);
        });

        master.gain.exponentialRampToValueAtTime(0.74, now + 0.01);
        master.gain.exponentialRampToValueAtTime(0.40, now + 0.8);
        master.gain.exponentialRampToValueAtTime(0.52, now + 2.4);

      } else if (sound === "organ") {
        addOsc("sine", frequency, 0, 0.34);
        addOsc("sine", frequency * 2, 0, 0.20);
        addOsc("triangle", frequency * 3, 0, 0.12);
        addOsc("sine", frequency * 4, 0, 0.08);

        master.gain.exponentialRampToValueAtTime(0.52, now + 0.04);
        master.gain.exponentialRampToValueAtTime(0.72, now + 2.5);

      } else if (sound === "gbpulse") {
        // Narrow pulse approximation: layered square waves with phase-like detuning.
        addOsc("square", frequency, -8, 0.20);
        addOsc("square", frequency, 8, 0.16);
        addOsc("square", frequency * 2, 0, 0.055);
        master.gain.exponentialRampToValueAtTime(0.48, now + 0.008);
        master.gain.exponentialRampToValueAtTime(0.58, now + 1.8);

      } else if (sound === "gbsquare") {
        // Classic handheld square-wave lead.
        addOsc("square", frequency, 0, 0.30);
        addOsc("square", frequency * 2, 0, 0.055);
        master.gain.exponentialRampToValueAtTime(0.46, now + 0.006);
        master.gain.exponentialRampToValueAtTime(0.54, now + 1.6);

      } else if (sound === "gbsoft") {
        // Softer chiptune lead: square core plus triangle body.
        addOsc("square", frequency, -4, 0.17);
        addOsc("square", frequency, 4, 0.17);
        addOsc("triangle", frequency / 2, 0, 0.12);
        master.gain.exponentialRampToValueAtTime(0.50, now + 0.012);
        master.gain.exponentialRampToValueAtTime(0.62, now + 2.2);

      } else if (sound === "gbbass") {
        // Chunky retro bass voice.
        addOsc("square", frequency / 2, 0, 0.25);
        addOsc("triangle", frequency / 2, 0, 0.22);
        addOsc("square", frequency, 0, 0.08);
        master.gain.exponentialRampToValueAtTime(0.58, now + 0.008);
        master.gain.exponentialRampToValueAtTime(0.68, now + 2.0);

      const now = ctx.currentTime;
      const current = Math.max(voice.master.gain.value, 0.0001);

      voice.master.gain.cancelScheduledValues(now);
      voice.master.gain.setValueAtTime(current, now);
      voice.master.gain.exponentialRampToValueAtTime(0.0001, now + release);

      voice.oscillators.forEach(osc => {
        try { osc.stop(now + release + 0.05); } catch {}
      });
    }

    function startVoice(frequency, color, key) {
      stopActiveVoice();
      activeVoice = buildVoice(frequency, soundSelect.value, true);

      light.style.backgroundColor = color;
      light.style.boxShadow = `0 0 70px ${color}`;
      key.classList.add("active");
      activeVoice.key = key;
    }

    function stopActiveVoice() {
      if (!activeVoice) return;
      releaseVoice(activeVoice, 0.65);
      activeVoice.key?.classList.remove("active");
      activeVoice = null;
    }

    function triggerKey(key) {
      if (!key || key === activeKey) return;
      activeKey = key;
      startVoice(Number(key.dataset.note), key.dataset.color, key);
    }

    keys.forEach(key => {
      key.addEventListener("pointerdown", event => {
        dragging = true;
        activeKey = null;
        key.setPointerCapture?.(event.pointerId);
        triggerKey(key);
      });
    });

    document.addEventListener("pointermove", event => {
      if (!dragging) return;
      const element = document.elementFromPoint(event.clientX, event.clientY);
      const key = element?.closest?.(".key");
      if (key) triggerKey(key);
    });

    function stopDragging() {
      dragging = false;
      activeKey = null;
      stopActiveVoice();
    }

    document.addEventListener("pointerup", stopDragging);
    document.addEventListener("pointercancel", stopDragging);

    soundSelect.addEventListener("change", () => {
      if (dragging && activeKey) {
        startVoice(Number(activeKey.dataset.note), activeKey.dataset.color, activeKey);
      }
    });

    function previewRollNote(keyIndex) {
      const key = keys[keyIndex];
      if (!key) return;

      const voice = buildVoice(Number(key.dataset.note), soundSelect.value, false);
      light.style.backgroundColor = key.dataset.color;
      light.style.boxShadow = `0 0 70px ${key.dataset.color}`;
      key.classList.add("active");

      setTimeout(() => {
        releaseVoice(voice, 0.18);
        key.classList.remove("active");
      }, 180);
    }

    function findNoteAtCell(keyIndex, step) {
      for (let startStep = step; startStep >= 0; startStep--) {
        const duration = Number(pattern[keyIndex][startStep]) || 0;
        if (duration > 0 && step >= startStep && step < startStep + duration) {
          return { startStep, duration };
        }
      }
      return null;
    }

    function clearNoteAtCell(keyIndex, step) {
      const note = findNoteAtCell(keyIndex, step);
      if (!note) return false;
      pattern[keyIndex][note.startStep] = 0;
      return true;
    }

    function placeNote(keyIndex, startStep, duration = 1) {
      startStep = Math.max(0, Math.min(STEPS - 1, startStep));
      duration = Math.max(1, Math.min(STEPS - startStep, duration));

      // Remove any notes touched by the new note's span so note objects never overlap.
      const endStep = startStep + duration - 1;
      const startsToClear = new Set();

      for (let step = startStep; step <= endStep; step++) {
        const existing = findNoteAtCell(keyIndex, step);
        if (existing) startsToClear.add(existing.startStep);
      }

      startsToClear.forEach(step => pattern[keyIndex][step] = 0);
      pattern[keyIndex][startStep] = duration;
    }

    function renderRoll() {
      pianoRoll.innerHTML = "";

      const corner = document.createElement("div");
      corner.className = "roll-corner";
      pianoRoll.appendChild(corner);

      for (let step = 0; step < STEPS; step++) {
        const n = document.createElement("div");
        n.className = "step-number";
        n.textContent = step + 1;
        pianoRoll.appendChild(n);
      }

      for (let visualRow = 0; visualRow < keys.length; visualRow++) {
        const keyIndex = keys.length - 1 - visualRow;
        const key = keys[keyIndex];

        const label = document.createElement("div");
        label.className = "roll-label";
        label.textContent = key.dataset.name;
        label.style.background = key.dataset.color;
        pianoRoll.appendChild(label);

        for (let step = 0; step < STEPS; step++) {
          const cell = document.createElement("div");
          cell.className = "roll-cell";
          if (step % 4 === 0) cell.classList.add("beat");

          const note = findNoteAtCell(keyIndex, step);
          if (note) {
            cell.classList.add("on");
            cell.style.background = key.dataset.color;
            cell.style.setProperty("--note-color", key.dataset.color);

            if (step > note.startStep) cell.classList.add("join-left");
            if (step < note.startStep + note.duration - 1) cell.classList.add("join-right");
          }

          cell.dataset.keyIndex = keyIndex;
          cell.dataset.step = step;
          cell.setAttribute("role", "button");
          cell.setAttribute("aria-label", `${key.dataset.name}, step ${step + 1}`);

          cell.addEventListener("pointerdown", event => {
            event.preventDefault();

            const existing = findNoteAtCell(keyIndex, step);

            // Clicking an existing note deletes that explicit note object.
            if (existing) {
              pattern[keyIndex][existing.startStep] = 0;
              renderRoll();
              return;
            }

            // A new press immediately creates a one-step note.
            // Moving horizontally before release stretches THIS note only.
            rollDragging = true;
            rollDragKeyIndex = keyIndex;
            rollDragStartStep = step;
            rollDragCurrentStep = step;
            rollDragPointerId = event.pointerId;

            placeNote(keyIndex, step, 1);
            previewRollNote(keyIndex);
            renderRoll();

            // Capture on the grid, then track pointer position with elementFromPoint.
            pianoRoll.setPointerCapture?.(event.pointerId);
          });

          pianoRoll.appendChild(cell);
        }
      }
    }

    function updateDraggedNoteFromPointer(event) {
      if (!rollDragging || event.pointerId !== rollDragPointerId) return;

      const element = document.elementFromPoint(event.clientX, event.clientY);
      const cell = element?.closest?.(".roll-cell");
      if (!cell || !pianoRoll.contains(cell)) return;

      const keyIndex = Number(cell.dataset.keyIndex);
      const step = Number(cell.dataset.step);

      // Sustain dragging is horizontal on the original pitch row.
      if (keyIndex !== rollDragKeyIndex || step === rollDragCurrentStep) return;

      rollDragCurrentStep = step;

      const start = Math.min(rollDragStartStep, step);
      const end = Math.max(rollDragStartStep, step);

      // Remove the in-progress note wherever its previous start currently is.
      for (let s = 0; s < STEPS; s++) {
        if (pattern[rollDragKeyIndex][s] > 0) {
          const noteEnd = s + pattern[rollDragKeyIndex][s] - 1;
          if (rollDragStartStep >= s && rollDragStartStep <= noteEnd) {
            pattern[rollDragKeyIndex][s] = 0;
            break;
          }
        }
      }

      placeNote(rollDragKeyIndex, start, end - start + 1);
      renderRoll();
    }

    document.addEventListener("pointermove", updateDraggedNoteFromPointer);

    function finishRollDrag(event) {
      if (!rollDragging) return;
      if (event?.pointerId != null && event.pointerId !== rollDragPointerId) return;

      try {
        if (rollDragPointerId != null && pianoRoll.hasPointerCapture?.(rollDragPointerId)) {
          pianoRoll.releasePointerCapture(rollDragPointerId);
        }
      } catch {}

      rollDragging = false;
      rollDragKeyIndex = null;
      rollDragStartStep = null;
      rollDragCurrentStep = null;
      rollDragPointerId = null;
      renderRoll();
    }

    document.addEventListener("pointerup", finishRollDrag);

      refreshSequenceSelect(name);

    function sanitizeFilename(name) {

    function offlineAddVoice(ctx, destination, frequency, sound, start, duration) {
      const master = ctx.createGain();

      function addOsc(type, freq, detune, volume, target = master) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        osc.detune.setValueAtTime(detune, start);
        gain.gain.setValueAtTime(volume, start);
        osc.connect(gain);
        gain.connect(target);
        osc.start(start);
        osc.stop(releaseEnd + 0.05);
        oscillators.push(osc);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(3600, start);
        filter.Q.setValueAtTime(0.6, start);
        filter.connect(master);

        [-18, -9, 0, 9, 18].forEach((detune, i) => {

        filter.frequency.setValueAtTime(1300, start);
        filter.Q.setValueAtTime(2.1, start);
        filter.connect(master);
        [-30, -15, 0, 15, 30].forEach((detune, i) => {
          addOsc(i === 2 ? "sawtooth" : "sine", frequency * 2, detune, i === 2 ? 0.11 : 0.10, filter);
        });
        master.gain.exponentialRampToValueAtTime(0.14, start + 0.25);
        master.gain.setValueAtTime(0.64, end);

      } else if (sound === "screambanshee") {
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1750, start);
        filter.Q.setValueAtTime(5.5, start);
        filter.connect(master);
        addOsc("sawtooth", frequency * 3, -28, 0.085, filter);
        addOsc("sawtooth", frequency * 3, 28, 0.085, filter);
        addOsc("square", frequency * 4.02, 0, 0.045, filter);
        master.gain.exponentialRampToValueAtTime(0.12, start + 0.10);
        master.gain.setValueAtTime(0.74, end);

      } else if (sound === "screammonster") {
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1250, start);
        filter.Q.setValueAtTime(2.8, start);
        filter.connect(master);
        addOsc("sawtooth", frequency / 2, -24, 0.19, filter);
        addOsc("sawtooth", frequency / 2, 24, 0.19, filter);
        addOsc("square", frequency * 0.75, -8, 0.08, filter);
        addOsc("triangle", frequency, 11, 0.11, filter);
        master.gain.exponentialRampToValueAtTime(0.88, start + 0.012);
        master.gain.exponentialRampToValueAtTime(0.62, start + 0.16);
        master.gain.setValueAtTime(0.74, end);

      } else if (sound === "musicbox") {
        addOsc("sine", frequency, 0, 0.30);
        addOsc("sine", frequency * 2, 2, 0.16);
        addOsc("sine", frequency * 4.01, -2, 0.07);
        master.gain.exponentialRampToValueAtTime(0.78, start + 0.004);
        master.gain.setValueAtTime(0.23, end);

      } else if (sound === "dulcimer") {
        const filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.setValueAtTime(4800, start); filter.connect(master);
        addOsc("triangle", frequency, -9, 0.24, filter); addOsc("triangle", frequency, 9, 0.24, filter); addOsc("sine", frequency * 2, -4, 0.12, filter);
        master.gain.exponentialRampToValueAtTime(0.76, start + 0.006); master.gain.setValueAtTime(0.28, end);

      } else if (sound === "celesta") {
        addOsc("sine", frequency, -3, 0.27); addOsc("sine", frequency, 3, 0.27); addOsc("sine", frequency * 2.01, 0, 0.13);
        master.gain.exponentialRampToValueAtTime(0.64, start + 0.01); master.gain.setValueAtTime(0.32, end);

      } else if (sound === "ocarina") {
        const filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.setValueAtTime(2600, start); filter.connect(master);
        addOsc("sine", frequency, -5, 0.34, filter); addOsc("sine", frequency, 5, 0.27, filter); addOsc("triangle", frequency * 2, 0, 0.045, filter);
        master.gain.exponentialRampToValueAtTime(0.30, start + 0.09); master.gain.setValueAtTime(0.50, end);

      } else if (sound === "reed") {
        const filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.setValueAtTime(2200, start); filter.connect(master);
        addOsc("square", frequency, -6, 0.10, filter); addOsc("square", frequency, 6, 0.10, filter); addOsc("triangle", frequency, 0, 0.22, filter);
        master.gain.exponentialRampToValueAtTime(0.37, start + 0.08); master.gain.setValueAtTime(0.54, end);

      } else if (sound === "crystal") {
        addOsc("sine", frequency, -7, 0.22); addOsc("sine", frequency, 7, 0.22); addOsc("sine", frequency * 2.51, 0, 0.11); addOsc("sine", frequency * 4.03, 0, 0.06);
        master.gain.exponentialRampToValueAtTime(0.58, start + 0.015); master.gain.setValueAtTime(0.37, end);

      } else if (sound === "copper") {
        const filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.setValueAtTime(3800, start); filter.connect(master);
        addOsc("sawtooth", frequency, -10, 0.10, filter); addOsc("triangle", frequency, 10, 0.24, filter); addOsc("sine", frequency / 2, 0, 0.10, filter);
        master.gain.exponentialRampToValueAtTime(0.55, start + 0.025); master.gain.setValueAtTime(0.60, end);

      } else if (sound === "deepbell") {
        addOsc("sine", frequency / 2, 0, 0.28); addOsc("sine", frequency, 0, 0.20); addOsc("sine", frequency * 1.49, 0, 0.12); addOsc("sine", frequency * 2.73, 0, 0.07);
        master.gain.exponentialRampToValueAtTime(0.82, start + 0.008); master.gain.setValueAtTime(0.31, end);

      } else if (sound === "frost") {
        const filter = ctx.createBiquadFilter(); filter.type = "highpass"; filter.frequency.setValueAtTime(420, start); filter.connect(master);
        [-20,-10,0,10,20].forEach((detune, i) => addOsc(i === 2 ? "triangle" : "sine", frequency * (i === 4 ? 2 : 1), detune, i === 2 ? 0.18 : 0.09, filter));
        master.gain.exponentialRampToValueAtTime(0.18, start + 0.22); master.gain.setValueAtTime(0.52, end);

      } else if (sound === "arcade") {
        addOsc("square", frequency, -10, 0.16); addOsc("square", frequency, 10, 0.16); addOsc("triangle", frequency * 2, 0, 0.10);
        master.gain.exponentialRampToValueAtTime(0.68, start + 0.006); master.gain.setValueAtTime(0.68, end);

      } else if (sound === "machine") {
        const filter = ctx.createBiquadFilter(); filter.type = "bandpass"; filter.frequency.setValueAtTime(980, start); filter.Q.setValueAtTime(3.4, start); filter.connect(master);
        addOsc("sawtooth", frequency / 2, -17, 0.15, filter); addOsc("square", frequency, 17, 0.10, filter); addOsc("sawtooth", frequency * 1.5, -8, 0.09, filter);
        master.gain.exponentialRampToValueAtTime(0.72, start + 0.018); master.gain.setValueAtTime(0.62, end);

      } else if (sound === "goblin") {
        const filter = ctx.createBiquadFilter(); filter.type = "bandpass"; filter.frequency.setValueAtTime(1900, start); filter.Q.setValueAtTime(2.2, start); filter.connect(master);
        addOsc("square", frequency * 2, -16, 0.09, filter); addOsc("triangle", frequency * 2, 16, 0.19, filter); addOsc("sine", frequency * 3.03, 0, 0.075, filter);
        master.gain.exponentialRampToValueAtTime(0.51, start + 0.025); master.gain.setValueAtTime(0.56, end);

      } else {
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(6200, start);
        filter.frequency.exponentialRampToValueAtTime(1500, Math.min(end, start + 1.2));
        filter.connect(master);

        addOsc("sawtooth", frequency, -5, 0.12, filter);
        addOsc("triangle", frequency, 0, 0.32, filter);
        addOsc("sawtooth", frequency, 5, 0.12, filter);

        master.gain.exponentialRampToValueAtTime(0.82, start + 0.008);
        master.gain.exponentialRampToValueAtTime(0.28, end);
      }

      master.gain.cancelScheduledValues(end);
      master.gain.setValueAtTime(Math.max(master.gain.value || 0.35, 0.08), end);
      master.gain.exponentialRampToValueAtTime(0.0001, releaseEnd);
    }

    function audioBufferToWavBlob(buffer) {
      const channels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const frames = buffer.length;
      const bytesPerSample = 2;
      const blockAlign = channels * bytesPerSample;
      const dataSize = frames * blockAlign;
      const arrayBuffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(arrayBuffer);

      function writeString(offset, text) {
        for (let i = 0; i < text.length; i++) {
          view.setUint8(offset + i, text.charCodeAt(i));
        }
      }

      writeString(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, channels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeString(36, "data");
      view.setUint32(40, dataSize, true);

      const channelData = [];
      for (let c = 0; c < channels; c++) channelData.push(buffer.getChannelData(c));

      let offset = 44;
      for (let i = 0; i < frames; i++) {
        for (let c = 0; c < channels; c++) {
          const sample = Math.max(-1, Math.min(1, channelData[c][i]));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
          offset += 2;
        }
      }

      return new Blob([arrayBuffer], { type: "audio/wav" });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function exportTrack() {
      if (!hasAnyNotes()) {
        exportStatus.textContent = "Draw at least one note before exporting.";
        return;
      }

      exportButton.disabled = true;
      exportStatus.textContent = "Rendering track…";

      try {
        const bpm = Math.min(240, Math.max(40, Number(tempoInput.value) || 110));
        const stepSeconds = (60 / bpm) / 4;
        const totalSeconds = STEPS * stepSeconds + 0.9;
        const sampleRate = 44100;

        const offline = new OfflineAudioContext(
          2,
          Math.ceil(totalSeconds * sampleRate),
          sampleRate
        );

        const limiter = offline.createDynamicsCompressor();
        limiter.threshold.setValueAtTime(-5, 0);
        limiter.knee.setValueAtTime(10, 0);
        limiter.ratio.setValueAtTime(8, 0);
        limiter.attack.setValueAtTime(0.003, 0);
        limiter.release.setValueAtTime(0.18, 0);
        limiter.connect(offline.destination);

        for (let step = 0; step < STEPS; step++) {
          const start = step * stepSeconds;

          for (let keyIndex = 0; keyIndex < keys.length; keyIndex++) {
            const lengthSteps = Number(pattern[keyIndex][step]) || 0;
            if (lengthSteps <= 0) continue;

            const noteDuration = Math.max(0.16, lengthSteps * stepSeconds * 0.96);

            offlineAddVoice(
              offline,
              limiter,
              Number(keys[keyIndex].dataset.note),
              soundSelect.value,
              start,
              noteDuration
            );
          }
        }

        const rendered = await offline.startRendering();

        // Browsers do not provide a native MP3 encoder. If a compatible
        // lamejs encoder is already available, use it; otherwise export WAV.
        if (window.lamejs && window.lamejs.Mp3Encoder) {
          exportStatus.textContent = "Encoding MP3…";

          const left = rendered.getChannelData(0);
          const right = rendered.numberOfChannels > 1 ? rendered.getChannelData(1) : left;
          const left16 = new Int16Array(left.length);
          const right16 = new Int16Array(right.length);

          for (let i = 0; i < left.length; i++) {
            left16[i] = Math.max(-32768, Math.min(32767, left[i] * 32767));
            right16[i] = Math.max(-32768, Math.min(32767, right[i] * 32767));
          }

          const encoder = new window.lamejs.Mp3Encoder(2, sampleRate, 192);
          const chunks = [];
          const block = 1152;

          for (let i = 0; i < left16.length; i += block) {
            const encoded = encoder.encodeBuffer(
              left16.subarray(i, i + block),
              right16.subarray(i, i + block)
            );
            if (encoded.length) chunks.push(new Int8Array(encoded));
          }

          const finalChunk = encoder.flush();
          if (finalChunk.length) chunks.push(new Int8Array(finalChunk));

          downloadBlob(
            new Blob(chunks, { type: "audio/mpeg" }),
            `${sanitizeFilename(sequenceName.value)}.mp3`
          );
          exportStatus.textContent = "MP3 exported.";
        } else {
          const wav = audioBufferToWavBlob(rendered);
          downloadBlob(wav, `${sanitizeFilename(sequenceName.value)}.wav`);
          exportStatus.textContent =
            "Exported as WAV. This browser has no built-in MP3 encoder, so lossless WAV is used instead.";
        }
      } catch (error) {
        console.error(error);
        exportStatus.textContent = "Export failed in this browser.";
      } finally {
        exportButton.disabled = false;
      }
    }

    exportButton.addEventListener("click", exportTrack);

    deleteSavedButton.addEventListener("click", () => {
      const names = Object.keys(savedSequences);

      if (names.length === 0) {
        exportStatus.textContent = "There are no saved tracks to delete.";
        return;
      }

      savedSequences = {};
      writeSavedSequences();
      refreshSequenceSelect();
      sequenceName.value = "Untitled";

      for (const row of pattern) row.fill(0);
      tempoInput.value = 110;
      renderRoll();
      exportStatus.textContent = "All saved tracks deleted.";
    });

    dialogPlayButton.addEventListener("click", () => {
      startSequence();
      dialogPlayButton.textContent = sequencePlaying ? "Stop" : "Play";
    });

    editButton.addEventListener("click", () => {
      renderRoll();
      dialogPlayButton.textContent = sequencePlaying ? "Stop" : "Play";
      updateLoopButtons();
      sequencerDialog.showModal();
    });

    closeButton.addEventListener("click", () => {
      sequencerDialog.close();
    });

    clearButton.addEventListener("click", () => {
      for (const row of pattern) row.fill(0);
      renderRoll();
    });

    sequencerDialog.addEventListener("click", event => {
      if (event.target === sequencerDialog) sequencerDialog.close();
    });

    function getNoteLengthSteps(keyIndex, startStep) {
      return Math.max(1, Number(pattern[keyIndex][startStep]) || 1);
    }

    function getStepDurationMs() {
      const bpm = Math.min(240, Math.max(40, Number(tempoInput.value) || 110));
      tempoInput.value = bpm;
      return (60000 / bpm) / 4;
    }

    function clearPlayHighlight() {
      document.querySelectorAll(".roll-cell.playing").forEach(cell => cell.classList.remove("playing"));
    }

    function releaseSequenceVoice(entry, release = 0.16) {
      releaseVoice(entry.voice, release);
      entry.key?.classList.remove("active");
    }

    function stopSequence() {
      sequencePlaying = false;
      if (playTimer) {
        clearTimeout(playTimer);
        playTimer = null;
      }

      sequenceVoices.forEach(entry => releaseSequenceVoice(entry, 0.18));
      sequenceVoices = [];
      clearPlayHighlight();
      playButton.classList.remove("active");
      playButton.title = "Play sequence";
      if (dialogPlayButton) dialogPlayButton.textContent = "Play";
      currentStep = 0;
    }

    function playStep(step) {
      const durationMs = getStepDurationMs();

      // Release sustained notes whose blocks end on this step.
      const stillPlaying = [];
      sequenceVoices.forEach(entry => {
        if (entry.endStep <= step) {
          releaseSequenceVoice(entry, 0.12);
        } else {
          stillPlaying.push(entry);
        }
      });
      sequenceVoices = stillPlaying;

      clearPlayHighlight();

      const notes = [];
      for (let keyIndex = 0; keyIndex < keys.length; keyIndex++) {
        const soundingNote = findNoteAtCell(keyIndex, step);
        if (!soundingNote) continue;

        const key = keys[keyIndex];
        notes.push(key);

        const cell = pianoRoll.querySelector(`.roll-cell[data-key-index="${keyIndex}"][data-step="${step}"]`);
        cell?.classList.add("playing");

        // Start only when this step is the explicit start of this note object.
        if (soundingNote.startStep === step) {
          const voice = buildVoice(Number(key.dataset.note), soundSelect.value, true);

          sequenceVoices.push({
            voice,
            key,
            endStep: step + soundingNote.duration
          });

          key.classList.add("active");
        }
      }

      if (notes.length) {
        const top = notes[notes.length - 1];
        light.style.backgroundColor = top.dataset.color;
        light.style.boxShadow = `0 0 70px ${top.dataset.color}`;
      }

      playTimer = setTimeout(() => {
        if (!sequencePlaying) return;

        const nextStep = step + 1;
        if (nextStep >= STEPS) {
          if (loopEnabled) {
            sequenceVoices.forEach(entry => releaseSequenceVoice(entry, 0.10));
            sequenceVoices = [];
            currentStep = 0;
            playStep(0);
          } else {
            stopSequence();
          }
        } else {
          currentStep = nextStep;
          playStep(nextStep);
        }
      }, durationMs);
    }

    function startSequence() {
      stopActiveVoice();
      if (sequencePlaying) {
        stopSequence();
        return;
      }

      sequencePlaying = true;
      currentStep = 0;
      playButton.classList.add("active");
      playButton.title = "Stop sequence";
      renderRoll();
      playStep(0);
    }

    playButton.addEventListener("click", startSequence);

    function updateLoopButtons() {
      loopButton.classList.toggle("active", loopEnabled);
      loopButton.setAttribute("aria-pressed", String(loopEnabled));
      dialogLoopButton.classList.toggle("active", loopEnabled);
      dialogLoopButton.setAttribute("aria-pressed", String(loopEnabled));
      dialogLoopButton.textContent = loopEnabled ? "Loop On" : "Loop";
    }

    loopButton.addEventListener("click", () => {
      loopEnabled = !loopEnabled;
      updateLoopButtons();
    });

    dialogLoopButton.addEventListener("click", () => {
      loopEnabled = !loopEnabled;
      updateLoopButtons();
    });

    readSavedSequences();
    refreshSequenceSelect();
    sequenceName.value = "Untitled";
    tempoInput.value = 110;
    renderRoll();
  </script>
</body>
</html>
